<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Form</title>

    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #111;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 20px #333;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: #222;
            color: white;
            border: 1px solid #555;
            border-radius: 8px;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: white;
            color: black;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #ccc;
        }

        #result {
            display: none;
            text-align: center;
        }

        #result h2 {
            font-size: 28px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div id="formSection">
            <h1>Enter Your Details</h1>

            <form onsubmit="showMessage(event)">

                <label for="height">Height (cm)</label>
                <input type="number" id="height" required>

                <label for="weight">Weight (kg)</label>
                <input type="number" id="weight" required>

                <label for="kalapan">Kalapan</label>
                <input type="text" id="kalapan" placeholder="Enter kalapan" required>

                <label for="address">Address</label>
                <textarea id="address" rows="4" placeholder="Enter address" required></textarea>

                <button type="submit">Submit</button>

            </form>
        </div>

        <div id="result">
            <h2>I GOT YOU LVDI 😎</h2>
        </div>

    </div>

    <script>
        function showMessage(event) {
            event.preventDefault();

            document.getElementById("formSection").style.display = "none";
            document.getElementById("result").style.display = "block";
        }
    </script>

</body>
</html>
